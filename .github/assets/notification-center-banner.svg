<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="380" viewBox="0 0 1800 380" role="img" aria-labelledby="title desc">
  <title id="title">Notification Center</title>
  <desc id="desc">Notification Center wordmark beside a bell carrying an unread badge.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1e8e3"/><stop offset="1" stop-color="#c8bbb5"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1800" height="380" fill="#211d1e"/>
  <path d="M144 190H260M1540 190H1656" stroke="#51484a" stroke-width="2"/>
  <g transform="translate(354 78)">
    <rect width="224" height="224" rx="8" fill="none" stroke="url(#frame)" stroke-width="7"/>
    <rect x="22" y="22" width="180" height="180" rx="4" fill="none" stroke="#6a5f61" stroke-width="2"/>
    <path d="M72 148c14-12 18-28 18-48 0-32 14-52 34-52s34 20 34 52c0 20 4 36 18 48z"
          fill="none" stroke="#f1e8e3" stroke-width="11" stroke-linejoin="round"/>
    <path d="M64 148h128" fill="none" stroke="#f1e8e3" stroke-width="11" stroke-linecap="round"/>
    <path d="M108 166a16 16 0 0 0 32 0" fill="none" stroke="#f1e8e3" stroke-width="11" stroke-linecap="round"/>
    <circle cx="160" cy="62" r="20" fill="#e0574a" filter="url(#glow)" opacity=".38"/>
    <circle cx="160" cy="62" r="15" fill="#e0574a"/>
  </g>
  <g fill="#f1e8e3">
    <text x="646" y="190" font-family="Inter, Arial, sans-serif" font-size="112" font-weight="600" letter-spacing="-5">Notification Center</text>
    <text x="651" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" letter-spacing="2" fill="#cbbdc0">EVERY NOTIFICATION YOU MISSED, IN THE OMARCHY BAR.</text>
  </g>
  <path d="M648 282H1400" stroke="#5c5254" stroke-width="2"/>
  <path d="M648 282H870" stroke="#e0574a" stroke-width="4"/>
